# Servicios para desarrollo local: `docker compose up -d`
# - PostgreSQL: goal_planner (app) y goal_planner_test / goal_planner_e2e (tests), usuario y contraseña `goal`.
# - Mailpit: servidor SMTP de pruebas (SMTP_URL=smtp://localhost:1025); los emails se ven en http://localhost:8025
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: goal
      POSTGRES_PASSWORD: goal
      POSTGRES_DB: goal_planner
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U goal']
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  pgdata:
