@if (visible()) {
  <div
    class="modal d-block"
    tabindex="-1"
    appDialog
    appDialogLabelledBy="authModalTitle"
    (appDialogDismiss)="closeModal()"
  >
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body p-4">
          <div class="text-center mb-4">
            <h4 class="modal-title fw-bold" id="authModalTitle">
              @if (showLogin()) {
                <ng-container i18n>Welcome Back!</ng-container>
              } @else {
                <ng-container i18n>Create your account</ng-container>
              }
            </h4>
            <button
              i18n-aria-label
              aria-label="Close"
              type="button"
              class="btn-close position-absolute top-0 end-0 m-3"
              (click)="closeModal()"
            ></button>
          </div>

          @if (errorMessage(); as message) {
            <div class="alert alert-danger py-2" role="alert">{{ message }}</div>
          }
          @if (successMessage(); as message) {
            <div class="alert alert-success py-2" role="status">{{ message }}</div>
          }

          @if (showLogin()) {
            <form id="loginForm" class="needs-validation">
              <div class="mb-3">
                <input
                  type="email"
                  name="emailId"
                  [(ngModel)]="loginObj.emailId"
                  class="form-control"
                  i18n-placeholder
                  placeholder="Email"
                  required
                />
              </div>
              <div class="mb-3">
                <input
                  type="password"
                  class="form-control"
                  name="password"
                  [(ngModel)]="loginObj.password"
                  i18n-placeholder
                  placeholder="Password"
                  required
                />
              </div>
              <button type="button" (click)="onLogin()" class="btn btn-primary w-100 mb-3" [disabled]="isLoading()">
                @if (isLoading()) {
                  <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
                }
                <ng-container i18n>Login</ng-container>
              </button>
              <p class="text-center">
                <ng-container i18n>Don't have an account?</ng-container>
                <button
                  type="button"
                  id="showSignup"
                  class="btn btn-link p-0 align-baseline text-decoration-none"
                  (click)="toggleForm()"
                  i18n
                >
                  Sign Up
                </button>
              </p>
            </form>
          } @else {
            <form id="signupForm" class="needs-validation">
              <div class="mb-3">
                <input
                  type="text"
                  name="fullName"
                  [(ngModel)]="registerObj.fullName"
                  class="form-control"
                  i18n-placeholder
                  placeholder="Full Name"
                  required
                />
              </div>
              <div class="mb-3">
                <input
                  type="email"
                  name="emailId"
                  [(ngModel)]="registerObj.emailId"
                  class="form-control"
                  i18n-placeholder
                  placeholder="Email"
                  required
                />
              </div>
              <div class="mb-3">
                <input
                  type="password"
                  name="password"
                  [(ngModel)]="registerObj.password"
                  class="form-control"
                  i18n-placeholder
                  placeholder="Password"
                  required
                />
              </div>
              <div class="mb-3">
                <input
                  type="tel"
                  name="mobileNo"
                  [(ngModel)]="registerObj.mobileNo"
                  class="form-control"
                  i18n-placeholder
                  placeholder="Mobile number"
                  required
                />
              </div>
              <button type="button" class="btn btn-primary w-100 mb-3" (click)="onRegister()" [disabled]="isLoading()">
                @if (isLoading()) {
                  <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
                }
                <ng-container i18n>Sign Up</ng-container>
              </button>
              <p class="text-center">
                <ng-container i18n>Already have an account?</ng-container>
                <button
                  type="button"
                  id="showLogin"
                  class="btn btn-link p-0 align-baseline text-decoration-none"
                  (click)="toggleForm()"
                  i18n
                >
                  Login
                </button>
              </p>
            </form>
          }
        </div>
      </div>
    </div>
  </div>
}
