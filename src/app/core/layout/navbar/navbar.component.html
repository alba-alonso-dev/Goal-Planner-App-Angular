<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" routerLink="/home">
      <i aria-hidden="true" class="bi bi-check-all me-2"></i>TaskMaster Pro
    </a>
    <button
      class="navbar-toggler"
      type="button"
      aria-controls="navbarNav"
      aria-label="Toggle navigation"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav" [class.show]="menuOpen()">
      <ul class="navbar-nav me-auto">
        @if (!authService.loggedUser()) {
          <li class="nav-item">
            <a class="nav-link" routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
              >Home</a
            >
          </li>
        } @else {
          <li class="nav-item">
            <a class="nav-link" routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/tasks" routerLinkActive="active">Tasks</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/goals" routerLinkActive="active">Goals</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/reminders" routerLinkActive="active">Reminders</a>
          </li>
        }
      </ul>

      @if (authService.loggedUser(); as user) {
        <button class="btn btn-outline-light me-2" disabled>
          <i aria-hidden="true" class="bi bi-person-fill me-2"></i>{{ user.emailId }}
        </button>
        <button class="btn btn-secondary" (click)="logout()">
          <i aria-hidden="true" class="bi bi-box-arrow-right me-2"></i>Logout
        </button>
      } @else {
        <button class="btn btn-outline-light" (click)="openModal()">
          <i aria-hidden="true" class="bi bi-person-fill me-2"></i>Login
        </button>
      }
    </div>
  </div>
</nav>

<!-- El modal (y @angular/forms) se descarga solo cuando hace falta; se precarga cuando el navegador está ocioso -->
@defer (when modalVisible(); prefetch on idle) {
  <app-login-modal [visible]="modalVisible()" (closed)="closeModal()"></app-login-modal>
}
