<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" routerLink="/home">
      <i aria-hidden="true" class="bi bi-check-all me-2"></i>TaskMaster Pro
    </a>
    <button
      class="navbar-toggler"
      type="button"
      aria-controls="navbarNav"
      i18n-aria-label
      aria-label="Toggle navigation"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav" [class.show]="menuOpen()">
      <ul class="navbar-nav me-auto">
        @if (!authService.loggedUser()) {
          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/home"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              i18n
              >Home</a
            >
          </li>
        } @else {
          <li class="nav-item">
            <a class="nav-link" routerLink="/dashboard" routerLinkActive="active" i18n>Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/tasks" routerLinkActive="active" i18n>Tasks</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/goals" routerLinkActive="active" i18n>Goals</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/reminders" routerLinkActive="active" i18n>Reminders</a>
          </li>
        }
      </ul>

      @if (authService.loggedUser(); as user) {
        <a class="btn btn-outline-light me-2" routerLink="/account" routerLinkActive="active">
          <i aria-hidden="true" class="bi bi-person-fill me-2"></i>{{ user.emailId }}
        </a>
        <button class="btn btn-secondary" (click)="logout()">
          <i aria-hidden="true" class="bi bi-box-arrow-right me-2"></i><ng-container i18n>Logout</ng-container>
        </button>
      } @else {
        <button class="btn btn-outline-light" (click)="openModal()">
          <i aria-hidden="true" class="bi bi-person-fill me-2"></i><ng-container i18n>Login</ng-container>
        </button>
      }
    </div>
  </div>
</nav>

<!-- El modal (y @angular/forms) se descarga solo cuando hace falta; se precarga cuando el navegador está ocioso -->
@defer (when modalVisible(); prefetch on idle) {
  <app-login-modal
    [visible]="modalVisible()"
    [initialView]="loginPrompt.view() ?? 'login'"
    (closed)="closeModal()"
  ></app-login-modal>
}
