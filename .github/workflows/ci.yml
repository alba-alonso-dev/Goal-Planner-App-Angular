name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check generated icon stylesheet
        run: npm run icons:check

      - name: Unit tests
        run: npm run test:ci

      # Las reglas de fechas dependen del huso horario: se repiten en uno al oeste de UTC
      - name: Unit tests (America/Los_Angeles)
        run: npm run test:ci
        env:
          TZ: America/Los_Angeles

      - name: Production build
        run: npm run build

  server:
    name: Backend (NestJS + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: goal
          POSTGRES_PASSWORD: goal
          POSTGRES_DB: goal_planner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://goal:goal@localhost:5432/goal_planner_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json

      # El lockfile del servidor se resuelve con npm 11 (npm 10 no lo acepta en `npm ci`)
      - name: Install dependencies
        run: npx -y npm@11.20.0 ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: End-to-end tests (real PostgreSQL)
        run: npm run test:e2e

      - name: Build
        run: npm run build
